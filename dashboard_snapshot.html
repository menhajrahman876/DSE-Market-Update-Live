<style>
/* ============================================================
   TOKENS  —  "Steel Contrast": a light theme pinned as the only mode.
   Deeper slate-blue page ground so every white card/table visibly lifts;
   teal-blue accent; teal gain / brick-red loss. Light is applied
   regardless of the OS colour-scheme (no dark @media override), so the
   dashboard looks identical for every viewer.

   --up-hdr / --down-hdr are the *on-header* gain/loss colours: the index
   chips sit on the dark header band, where the on-white --up/--down fail
   AA, so the chip percentages use these brighter variants instead
   (measured >=4.5:1 on --hdr-1).
   ============================================================ */
:root{
  --bg:#e6ecf4; --bg-grad:#dbe3ee;
  --surface:#ffffff; --surface-2:#dde6f1; --surface-3:#cfdaea;
  --ink:#16202e; --ink-2:#33465c; --muted:#51637a;
  --line:#cbd8e8; --line-soft:#e8eef6;
  --up:#0f766e; --up-soft:rgba(15,118,110,.11); --up-flash:rgba(15,118,110,.26);
  --down:#b91c1c; --down-soft:rgba(185,28,28,.10); --down-flash:rgba(185,28,28,.26);
  --up-hdr:#4ade80; --down-hdr:#fb7185;
  --flat:#64748b;
  --accent:#0e7490; --accent-soft:rgba(14,116,144,.12);
  --gold:#a16207; --gold-soft:#fdf3d7;
  --hdr-1:#1c3040; --hdr-2:#2b4a5f;
  --surface-rgb:255,255,255;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.05);
  --shadow-lg:0 4px 16px rgba(15,23,42,.12);
  /* density 9/10 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --r-sm:5px; --r-md:8px; --r-lg:11px;
  --mono:'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Fira Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;}
html{background:var(--bg);}
body{margin:0;font-family:var(--sans);font-size:13px;line-height:1.45;
  background:linear-gradient(180deg,var(--bg-grad),var(--bg) 340px);
  background-attachment:fixed;color:var(--ink);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
a{color:var(--accent);}
.num,.kpi-value,.chip-val,table.data-table td,.stat-v{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.wrap{max-width:1560px;margin:0 auto;padding:0 var(--sp-4) 40px;}
.pos{color:var(--up);} .neg{color:var(--down);}

/* ============================================================ HEADER */
header.top{background:linear-gradient(135deg,var(--hdr-1),var(--hdr-2));
  border-bottom:1px solid rgba(255,255,255,.07);padding:14px 0 0;margin-bottom:var(--sp-3);}
header.top .inner{max-width:1560px;margin:0 auto;padding:0 var(--sp-4);}
.hdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-4);flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:9px;flex:0 0 34px;
  background:linear-gradient(140deg,var(--accent),#7c3aed);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:600;font-size:12px;color:#fff;letter-spacing:-.4px;
  box-shadow:0 2px 12px rgba(56,189,248,.35);}
header.top h1{margin:0;font-size:16px;font-weight:600;color:#fff;letter-spacing:-.15px;}
header.top .sub{font-size:11px;color:#8fa0be;margin-top:1px;font-family:var(--mono);}
.hdr-status{display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);max-width:640px;}
.snapshot-note{font-size:10.5px;color:#c8d3e6;line-height:1.35;}
.live-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--gold);
  box-shadow:0 0 0 0 rgba(245,158,11,.6);}
.live-dot.live{background:var(--up-hdr);animation:pulse 2.1s ease-out infinite;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.55);}
  70%{box-shadow:0 0 0 7px rgba(34,197,94,0);}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}
}
/* ticker-tape index chips */
.idx-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));
  gap:var(--sp-2);margin:var(--sp-3) 0 0;padding-bottom:var(--sp-3);}
.idx-chip{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
  border-radius:var(--r-md);padding:8px 11px;position:relative;overflow:hidden;
  transition:border-color .2s,background .2s;}
.idx-chip:hover{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.16);}
.idx-chip .chip-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
.idx-chip .lbl{font-size:9.5px;color:#8fa0be;text-transform:uppercase;letter-spacing:.7px;font-weight:600;}
.idx-chip .chip-chg{font-size:11px;font-weight:600;font-family:var(--mono);}
/* index chips sit on the dark header band -> use the on-header gain/loss
   variants (AA-safe on --hdr-1), not the on-white --up/--down */
.idx-chip .chip-chg.pos{color:var(--up-hdr);}
.idx-chip .chip-chg.neg{color:var(--down-hdr);}
.idx-chip .chip-body{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:2px;}
.idx-chip .chip-val{font-size:19px;font-weight:600;color:#fff;letter-spacing:-.4px;line-height:1.15;}
.idx-chip .chip-sub{font-size:10px;color:#8fa0be;font-family:var(--mono);margin-top:1px;}
.chip-spark{opacity:.95;flex:0 0 auto;}

/* ============================================================ TABS */
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:4px;box-shadow:var(--shadow);margin-bottom:var(--sp-3);
  position:sticky;top:6px;z-index:30;}
nav.tabs button{appearance:none;border:none;background:transparent;color:var(--muted);
  font-family:var(--sans);font-size:11.5px;font-weight:600;padding:7px 11px;border-radius:var(--r-sm);
  cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;letter-spacing:.1px;}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink);}
nav.tabs button.active{background:var(--accent);color:#fff;box-shadow:0 1px 6px var(--accent-soft);}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.tabpanel{display:none;} .tabpanel.active{display:block;}

/* ============================================================ LAYOUT */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3);}
@media (max-width:1080px){.grid2,.grid3{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--sp-3) var(--sp-4) var(--sp-4);box-shadow:var(--shadow);margin-bottom:var(--sp-3);}
.card h3{margin:0 0 2px;font-size:12.5px;font-weight:600;letter-spacing:-.1px;
  display:flex;align-items:center;gap:7px;}
.card h3::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--accent);flex:0 0 3px;}
.card .note{font-size:10.5px;color:var(--muted);margin:2px 0 10px 10px;line-height:1.45;}
.card canvas{max-height:320px;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:var(--sp-3);margin-bottom:var(--sp-3);}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:11px var(--sp-3) 10px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kpi-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;
  font-weight:600;margin-bottom:3px;}
.kpi-main{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;}
.kpi-value{font-size:21px;font-weight:600;letter-spacing:-.5px;line-height:1.15;}
.kpi-sub{font-size:10.5px;margin-top:2px;color:var(--muted);font-family:var(--mono);}

/* flash-on-change */
@keyframes flashUp{0%{background-color:var(--up-flash);}100%{background-color:transparent;}}
@keyframes flashDown{0%{background-color:var(--down-flash);}100%{background-color:transparent;}}
.flash-up{animation:flashUp 1.7s ease-out;border-radius:4px;box-decoration-break:clone;}
.flash-down{animation:flashDown 1.7s ease-out;border-radius:4px;box-decoration-break:clone;}
@media (prefers-reduced-motion: reduce){
  .flash-up,.flash-down{animation:none;}
  .live-dot.live{animation:none;}
  *{scroll-behavior:auto !important;}
}

/* banners / pills */
.banner{border-radius:var(--r-md);padding:7px 11px;font-size:11.5px;font-weight:500;
  margin-bottom:var(--sp-3);border:1px solid transparent;}
.banner.warn{background:var(--down-soft);color:var(--down);border-color:var(--down);}
.banner.ok{background:var(--up-soft);color:var(--up);border-color:var(--up-soft);}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:9.5px;
  font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.pill.workbook{background:var(--up-soft);color:var(--up);}
.pill.external{background:var(--gold-soft);color:var(--gold);}

/* ============================================================ TABLES */
.tbl-wrap{width:100%;}
.tbl-toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:7px;}
.tbl-toolbar input[type=text],.tbl-toolbar select,.tbl-toolbar input[type=date]{
  padding:5px 8px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--ink);font-size:11.5px;font-family:var(--sans);
  transition:border-color .15s,box-shadow .15s;}
.tbl-toolbar input[type=text]{min-width:190px;}
.tbl-toolbar input:focus,.tbl-toolbar select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);}
.tbl-count{font-size:10px;color:var(--muted);margin-left:auto;font-family:var(--mono);}
.tbl-scroll{overflow-x:auto;}
.tbl-scroll.sticky{max-height:560px;overflow-y:auto;}
table.data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.8px;}
table.data-table thead th{text-align:left;padding:6px 8px;background:var(--surface);
  border-bottom:1px solid var(--line);color:var(--muted);font-weight:600;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;cursor:pointer;
  user-select:none;font-family:var(--sans);transition:color .15s;}
.tbl-scroll.sticky thead th{position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 var(--line);}
table.data-table thead th:hover{color:var(--ink);}
table.data-table thead th.sorted-asc,table.data-table thead th.sorted-desc{color:var(--accent);}
table.data-table thead th.sorted-asc::after{content:" ▲";font-size:7px;}
table.data-table thead th.sorted-desc::after{content:" ▼";font-size:7px;}
table.data-table tbody td{padding:4px 8px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
table.data-table tbody tr{transition:background .12s;}
table.data-table tbody tr.rt-up{background:linear-gradient(90deg,var(--up-soft),transparent 55%);}
table.data-table tbody tr.rt-down{background:linear-gradient(90deg,var(--down-soft),transparent 55%);}
table.data-table tbody tr:hover{background:var(--surface-2);}
.clickable-row tbody tr{cursor:pointer;}
table.data-table td.col-key{font-family:var(--sans);font-weight:600;color:var(--ink);}
.filter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
  padding:3px 5px 3px 10px;border-radius:999px;font-size:11px;font-weight:600;margin-bottom:8px;}
.filter-chip button{background:rgba(255,255,255,.25);border:none;color:#fff;border-radius:50%;
  width:16px;height:16px;font-size:11px;cursor:pointer;line-height:1;}
.filter-chip button:hover{background:rgba(255,255,255,.4);}

/* segmented lookback control */
.tag-row{display:inline-flex;gap:2px;flex-wrap:wrap;margin-bottom:10px;
  background:var(--surface-2);padding:3px;border-radius:var(--r-md);border:1px solid var(--line);}
.tag-row button{padding:4px 11px;border-radius:var(--r-sm);border:none;background:transparent;
  color:var(--muted);font-size:11px;cursor:pointer;font-weight:600;font-family:var(--mono);
  transition:background .15s,color .15s;}
.tag-row button:hover{color:var(--ink);}
.tag-row button.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow);}
.tag-row button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

/* sparkline + perf strip */
svg.spark{display:block;}
.perf-strip{display:inline-flex;align-items:flex-end;gap:1.5px;height:14px;vertical-align:middle;}
.perf-strip i{width:4px;border-radius:1px;display:block;min-height:1px;}

/* ============================================================ HEATMAP */
.heat-controls{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.heat-controls label{font-size:10px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.6px;font-weight:600;margin-right:5px;}
.heatmap{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;
  grid-auto-rows:minmax(52px,auto);grid-auto-flow:row dense;}
@media (max-width:900px){.heatmap{grid-template-columns:repeat(6,1fr);}}
.heat-tile{border-radius:var(--r-sm);padding:6px 8px;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid rgba(128,128,128,.16);transition:transform .12s,box-shadow .12s,filter .12s;}
.heat-tile:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);filter:brightness(1.06);}
.heat-tile:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.heat-name{font-size:10px;font-weight:600;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.heat-val{font-family:var(--mono);font-weight:600;line-height:1.1;}
.heat-meta{font-family:var(--mono);font-size:8.5px;opacity:.75;line-height:1.2;}
.heat-legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:9.5px;
  color:var(--muted);font-family:var(--mono);flex-wrap:wrap;}
.heat-legend .swatch{width:26px;height:11px;border-radius:2px;border:1px solid rgba(128,128,128,.2);}

.commentary{font-size:12.5px;line-height:1.65;color:var(--ink-2);}
.reading{font-size:12px;line-height:1.7;background:var(--surface-2);border-radius:var(--r-md);
  padding:11px 13px;border-left:3px solid var(--accent);color:var(--ink-2);}
.empty-note{font-size:11.5px;color:var(--muted);font-style:italic;padding:9px 0;}
footer.foot{text-align:center;font-size:10px;color:var(--muted);padding:18px 0 6px;font-family:var(--mono);}
</style>
</head>

/* ---------------------------------------------------------------------
   theme-aware palette -- read the CSS tokens so JS-drawn things
   (Chart.js, sparklines, heatmap) match the active colour scheme
--------------------------------------------------------------------- */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
let TH = {};
function readTheme(){
  TH = {
    ink: cssVar('--ink'), muted: cssVar('--muted'), line: cssVar('--line'),
    surface: cssVar('--surface'), up: cssVar('--up'), down: cssVar('--down'),
    accent: cssVar('--accent'), flat: cssVar('--flat'),
    surfaceRGB: cssVar('--surface-rgb').split(',').map(Number),
    dark: darkMQ.matches,
  };
}
readTheme();
const COLORS = () => [TH.accent, '#f59e0b', TH.up, TH.down, '#a78bfa', '#2dd4bf', '#f472b6', '#94a3b8'];

const CHARTS = [];
function applyChartDefaults(){
  Chart.defaults.font.family = "'Fira Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif";
  Chart.defaults.font.size = 10;
  Chart.defaults.color = TH.muted;
  Chart.defaults.borderColor = TH.line;
  Chart.defaults.plugins.tooltip.backgroundColor = TH.dark ? 'rgba(8,13,24,.95)' : 'rgba(15,23,42,.95)';
  Chart.defaults.plugins.tooltip.titleColor = '#fff';
  Chart.defaults.plugins.tooltip.bodyColor = '#e8edf7';
  Chart.defaults.plugins.tooltip.borderColor = 'rgba(255,255,255,.14)';
  Chart.defaults.plugins.tooltip.borderWidth = 1;
  Chart.defaults.plugins.tooltip.padding = 9;
  Chart.defaults.plugins.tooltip.cornerRadius = 6;
  Chart.defaults.plugins.tooltip.titleFont = {size:10.5, weight:'600'};
  Chart.defaults.plugins.tooltip.bodyFont = {size:10.5, family:"'Fira Code',monospace"};
}
applyChartDefaults();
darkMQ.addEventListener('change', ()=>{
  readTheme(); applyChartDefaults();
  CHARTS.forEach(c=>{ try{ c.update('none'); }catch(e){} });
  document.querySelectorAll('[data-heat]').forEach(paintHeatTile);
});

/* ---------------------------------------------------------------------
   formatting helpers -- mirror dse_render.py's fnum/fint/fpct exactly
--------------------------------------------------------------------- */
function fnum(v, dp=2){ if(v===null||v===undefined||Number.isNaN(v)) return '-';
  return Number(v).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function fint(v){ if(v===null||v===undefined||Number.isNaN(v)) return '-';
  return Math.round(Number(v)).toLocaleString(); }
function fpct(v, dp=2, sign=true){ if(v===null||v===undefined||Number.isNaN(v)) return '-';
  const s = sign ? (v>=0?'+':'') : '';
  return s + Number(v).toFixed(dp) + '%'; }
function fpctNM(v, dp=1, cap=500){ if(v===null||v===undefined) return '-';
  if(Math.abs(v)>cap) return 'n/m'; return (v>=0?'+':'')+Number(v).toFixed(dp)+'%'; }
function signCls(v){ if(v===null||v===undefined||Number.isNaN(v)) return ''; return v>0?'pos':(v<0?'neg':''); }
function dstr(d){ if(!d) return '-'; const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function dshort(d){ if(!d) return '-'; const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function fmt(v, kind){
  switch(kind){
    case 'num2': return fnum(v,2); case 'num1': return fnum(v,1); case 'num0': return fnum(v,0);
    case 'int': return fint(v); case 'pct2': return fpct(v,2); case 'pct1': return fpct(v,1);
    case 'pct2ns': return fpct(v,2,false); case 'pctnm': return fpctNM(v);
    case 'date': return dstr(v); case 'dateshort': return dshort(v);
    case 'x': return (v===null||v===undefined) ? '-' : Number(v).toFixed(1)+'x';
    default: return (v===null||v===undefined||v==='') ? '-' : v;
  }
}

/* ---------------------------------------------------------------------
   LIVE: flash + count-up on values that changed since the last refresh.
   Previous values are kept in sessionStorage, so this works both for the
   Streamlit auto-refresh (iframe reloads each cycle) and for a manual
   re-run of the static file. All storage access is guarded -- a sandboxed
   iframe that blocks storage just means "no flash", never a broken page.
--------------------------------------------------------------------- */
const LIVE_KEY = 'dse_live_prev_v1';
let PREV = {};
const NEXT = {};
try { PREV = JSON.parse(sessionStorage.getItem(LIVE_KEY) || '{}') || {}; } catch(e) { PREV = {}; }
function savePrev(){ try { sessionStorage.setItem(LIVE_KEY, JSON.stringify(NEXT)); } catch(e){} }

function flash(node, dir){
  if(REDUCED || !dir || !node) return;
  node.classList.remove('flash-up','flash-down');
  void node.offsetWidth;                       // restart the animation
  node.classList.add(dir > 0 ? 'flash-up' : 'flash-down');
  setTimeout(()=>node.classList.remove('flash-up','flash-down'), 1800);
}
function animateNumber(node, from, to, formatter, ms=560){
  if(REDUCED || from === null || from === undefined || !isFinite(from) || from === to){
    node.textContent = formatter(to); return;
  }
  const t0 = performance.now();
  (function step(now){
    const p = Math.min((now - t0)/ms, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    node.textContent = formatter(from + (to - from) * eased);
    if(p < 1) requestAnimationFrame(step);
  })(performance.now());
}
/** Render `value` into `node`, flashing + counting up if it moved since last refresh. */
function liveValue(node, key, value, formatter){
  NEXT[key] = value;
  const prev = (key in PREV) ? PREV[key] : null;
  if(value === null || value === undefined || !isFinite(value)){ node.textContent = formatter(value); return; }
  if(prev === null || prev === undefined || !isFinite(prev) || prev === value){
    node.textContent = formatter(value);
    return;
  }
  animateNumber(node, prev, value, formatter);
  flash(node, value - prev);
}

/* ---------------------------------------------------------------------
   sparklines (inline SVG, gradient-filled) + multi-period perf strips
--------------------------------------------------------------------- */
let sparkSeq = 0;
function sparkline(values, opts={}){
  const w = opts.w || 104, h = opts.h || 30;
  const vals = (values || []).filter(v => v !== null && v !== undefined && isFinite(v));
  if(vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const step = w / (vals.length - 1);
  const pts = vals.map((v,i)=> [i*step, h - 1 - ((v-min)/span)*(h-3)]);
  const line = pts.map((p,i)=> (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L ${w} ${h} L 0 ${h} Z`;
  const rising = vals[vals.length-1] >= vals[0];
  const col = opts.color || (rising ? TH.up : TH.down);
  const id = 'spk' + (sparkSeq++);
  const last = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:${col};stop-opacity:.38"/>
      <stop offset="100%" style="stop-color:${col};stop-opacity:0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="1.7" fill="${col}"/>
  </svg>`;
}
/** Honest inline trend for a scrip: the payload carries no per-ticker price
    series, so instead of inventing one we draw the four real multi-period
    returns the workbook does provide. */
function perfStrip(periods){
  const vals = periods.filter(p => p[1] !== null && p[1] !== undefined);
  if(!vals.length) return '';
  const maxAbs = Math.max(...vals.map(p => Math.abs(p[1])), 1);
  const bars = periods.map(([lbl,v])=>{
    if(v === null || v === undefined) return `<i style="height:1px;background:${TH.flat};opacity:.4"></i>`;
    const hgt = Math.max(2, Math.round(Math.min(Math.abs(v)/maxAbs, 1) * 13));
    return `<i style="height:${hgt}px;background:${v>=0?TH.up:TH.down}"></i>`;
  }).join('');
  const title = periods.map(([lbl,v]) => `${lbl} ${v===null||v===undefined?'-':fpct(v)}`).join('  ·  ');
  return `<span class="perf-strip" title="${title}">${bars}</span>`;
}

/* ---------------------------------------------------------------------
   generic sortable / searchable table
--------------------------------------------------------------------- */
function buildTable(container, cols, rows, opts={}){
  opts = Object.assign({search:true, rowClick:null, limit:null, defaultSort:null,
                        defaultDir:'desc', searchPlaceholder:'Search...',
                        sticky:false, rowTintBy:null}, opts);
  let searchVal = '';
  let sortKey = opts.defaultSort;
  let sortDir = opts.defaultDir;
  let externalFilter = opts.externalFilter || null;

  const root = document.createElement('div'); root.className='tbl-wrap';
  const toolbar = document.createElement('div'); toolbar.className='tbl-toolbar';
  if(opts.search){
    const inp = document.createElement('input');
    inp.type='text'; inp.placeholder=opts.searchPlaceholder;
    inp.addEventListener('input', e=>{ searchVal=e.target.value.toLowerCase(); renderBody(); });
    toolbar.appendChild(inp);
  }
  if(opts.extraControls) opts.extraControls.forEach(el=>toolbar.appendChild(el));
  const count = document.createElement('span'); count.className='tbl-count';
  toolbar.appendChild(count);
  root.appendChild(toolbar);

  const scroll = document.createElement('div');
  scroll.className = 'tbl-scroll' + (opts.sticky ? ' sticky' : '');
  const table = document.createElement('table'); table.className='data-table';
  if(opts.rowClick) table.classList.add('clickable-row');
  const thead=document.createElement('thead'); const trh=document.createElement('tr');
  cols.forEach(c=>{
    const th=document.createElement('th'); th.textContent=c.label; th.style.textAlign=c.align||'left';
    th.addEventListener('click',()=>{
      if(sortKey===c.key) sortDir = sortDir==='asc'?'desc':'asc';
      else { sortKey=c.key; sortDir = c.textSort ? 'asc':'desc'; }
      renderBody();
    });
    trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody=document.createElement('tbody'); table.appendChild(tbody);
  scroll.appendChild(table); root.appendChild(scroll);
  container.innerHTML=''; container.appendChild(root);

  function renderBody(){
    let data = rows;
    if(externalFilter) data = data.filter(externalFilter);
    if(searchVal){
      const fields = opts.searchFields || cols.map(c=>c.key);
      data = data.filter(r => fields.some(k => String(r[k] ?? '').toLowerCase().includes(searchVal)));
    }
    if(sortKey){
      data = data.slice().sort((a,b)=>{
        let av=a[sortKey], bv=b[sortKey];
        const aMiss = av===null||av===undefined, bMiss = bv===null||bv===undefined;
        if(aMiss && bMiss) return 0;
        if(aMiss) return 1; if(bMiss) return -1;
        let c;
        if(typeof av==='string') c = av.localeCompare(bv); else c = av<bv?-1:(av>bv?1:0);
        return sortDir==='asc' ? c : -c;
      });
    }
    count.textContent = `${data.length.toLocaleString()} of ${rows.length.toLocaleString()}`;
    Array.from(trh.children).forEach((th,i)=>{
      th.classList.remove('sorted-asc','sorted-desc');
      if(cols[i].key===sortKey) th.classList.add(sortDir==='asc'?'sorted-asc':'sorted-desc');
    });
    tbody.innerHTML='';
    const shown = opts.limit ? data.slice(0,opts.limit) : data;
    if(!shown.length){
      const tr=document.createElement('tr'); const td=document.createElement('td');
      td.colSpan=cols.length; td.className='empty-note'; td.textContent='No rows match.';
      tr.appendChild(td); tbody.appendChild(tr);
    }
    shown.forEach(r=>{
      const tr=document.createElement('tr');
      if(opts.rowTintBy){
        const tv = r[opts.rowTintBy];
        if(tv !== null && tv !== undefined && isFinite(tv) && tv !== 0)
          tr.classList.add(tv > 0 ? 'rt-up' : 'rt-down');
      }
      if(opts.rowClick) tr.addEventListener('click',()=>opts.rowClick(r));
      cols.forEach((c,ci)=>{
        const td=document.createElement('td'); td.style.textAlign=c.align||'left';
        const raw = r[c.key];
        const text = typeof c.format === 'function' ? c.format(raw, r)
          : (c.format ? fmt(raw, c.format) : (raw ?? '-'));
        if(c.html) td.innerHTML = text; else td.textContent = text;
        if(ci === 0 && !c.html) td.classList.add('col-key');
        const colorField = c.colorBy || (c.color ? c.key : null);
        if(colorField){ const cls=signCls(r[colorField]); if(cls) td.classList.add(cls); }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }
  renderBody();
  return { refresh:renderBody, setFilter(fn){ externalFilter=fn; renderBody(); } };
}

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

/* ---------------------------------------------------------------------
   chart helpers -- gradient area fills, TradingView style
--------------------------------------------------------------------- */
function areaGradient(ctx, color, strength=0.34){
  const g = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height || 280);
  g.addColorStop(0, hexA(color, strength));
  g.addColorStop(1, hexA(color, 0));
  return g;
}
function hexA(c, a){
  if(c.startsWith('#')){
    const n = c.length === 4
      ? [parseInt(c[1]+c[1],16), parseInt(c[2]+c[2],16), parseInt(c[3]+c[3],16)]
      : [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
    return `rgba(${n[0]},${n[1]},${n[2]},${a})`;
  }
  if(c.startsWith('rgb')) return c.replace(/rgba?\(([^)]+)\)/, (m,inner)=>{
    const p = inner.split(',').slice(0,3).map(s=>s.trim());
    return `rgba(${p.join(',')},${a})`;
  });
  return c;
}
function lineChart(canvas, labels, datasets, opts={}){
  const pal = COLORS();
  const ch = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets: datasets.map((d,i)=>{
      const col = d.color || pal[i % pal.length];
      return {
        label:d.label, data:d.data, borderColor:col, borderWidth:d.width||1.8,
        backgroundColor: d.fill ? areaGradient(canvas.getContext('2d'), col) : hexA(col,.12),
        borderDash:d.dash||[], pointRadius:0, pointHoverRadius:3.5,
        pointHoverBackgroundColor:col, pointHoverBorderColor:'#fff', pointHoverBorderWidth:1.5,
        tension:d.tension??0.22, yAxisID:d.yAxisID||'y', fill:d.fill||false, order:d.order||0,
      };
    })},
    options: Object.assign({
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'top',align:'end',
          labels:{usePointStyle:true,pointStyle:'line',boxWidth:14,boxHeight:2,padding:12,font:{size:10}}} },
      scales:{ x:{grid:{display:false},border:{color:TH.line},
                  ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:9,font:{size:9.5}}},
               y:{grid:{color:hexA(TH.line,.55),drawTicks:false},border:{display:false},
                  ticks:{font:{size:9.5},padding:6}} },
    }, opts)
  });
  CHARTS.push(ch);
  return ch;
}
function barChart(canvas, labels, data, opts={}){
  const horizontal = opts.horizontal !== false;
  const colors = opts.colorFn ? data.map(opts.colorFn) : (opts.color || TH.accent);
  const ch = new Chart(canvas.getContext('2d'), {
    type:'bar',
    data:{ labels, datasets:[{ label:opts.label||'', data, backgroundColor:colors,
      borderRadius:3, borderSkipped:false, barPercentage:.82, categoryPercentage:.86 }] },
    options:{ responsive:true, maintainAspectRatio:false, animation:false, indexAxis:horizontal?'y':'x',
      plugins:{ legend:{display:false},
        tooltip:{callbacks:{label:(c)=> opts.tooltipFmt ? opts.tooltipFmt(c.parsed[horizontal?'x':'y']) : c.formattedValue }} },
      scales:{ x:{grid:{display:horizontal,color:hexA(TH.line,.55),drawTicks:false},border:{display:false},ticks:{font:{size:9.5}}},
               y:{grid:{display:!horizontal,color:hexA(TH.line,.55),drawTicks:false},border:{display:false},ticks:{font:{size:9.5}}} } }
  });
  CHARTS.push(ch);
  return ch;
}

function blendRGB(fg, alpha, bg){ return fg.map((c,i)=> Math.round(c*alpha + bg[i]*(1-alpha))); }
function relLum([r,g,b]){
  const f = c => { c/=255; return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b);
}
/** Pick whichever ink actually contrasts better against the blended tile --
    measured, not guessed, so the small print on a tile always clears AA. */
const INK_DARK = '#06101d', INK_LIGHT = '#f7fbff';
function bestInk(rgb){
  const L = relLum(rgb);
  const cd = (L + 0.05) / (relLum([6,16,29]) + 0.05);
  const cl = (relLum([247,251,255]) + 0.05) / (L + 0.05);
  return cd >= cl ? INK_DARK : INK_LIGHT;
}
/** Paint one tile: tint intensity by |return|, then pick black/white text by
    the measured luminance of the blend so the % stays legible in both themes. */
function paintHeatTile(tile){
  const v = tile.dataset.val === '' ? null : Number(tile.dataset.val);
  const maxAbs = Number(tile.dataset.max) || 1;
  const bg = TH.surfaceRGB;
  let rgb;
  if(v === null || !isFinite(v)){
    rgb = blendRGB([128,138,155], .18, bg);
  } else {
    const t = Math.min(Math.abs(v)/maxAbs, 1);
    const alpha = 0.14 + Math.pow(t, .75) * 0.72;
    const base = v >= 0 ? [34,197,94] : [239,68,68];
    rgb = blendRGB(base, alpha, bg);
  }
  tile.style.background = `rgb(${rgb.join(',')})`;
  tile.style.color = bestInk(rgb);
}

  const heat = el('div','heatmap'); cHeat.appendChild(heat);
  const legend = el('div','heat-legend'); cHeat.appendChild(legend);
  root.appendChild(cHeat);

  function spanFor(share){
    if(share >= 11) return [6,2];
    if(share >= 6.5) return [4,2];
    if(share >= 3.5) return [4,1];
    if(share >= 1.8) return [3,1];
    if(share >= 0.8) return [2,1];
    return [2,1];
  }
  function drawHeat(){
    const sizeKey = sizeSel.value, colKey = colSel.value;
    heat.innerHTML = '';
    const items = secs.slice().sort((a,b)=> (b[sizeKey]||0) - (a[sizeKey]||0));

      const [cols,rowsSpan] = spanFor(s[sizeKey] || 0);
      const tile = el('div','heat-tile');

        `Mcap: ${fnum(s.mcap/1e9,1)} bn (${fpct(s.weight,2,false)})\nCompanies: ${fint(s.n)}`;

      tile.innerHTML =
        `<div class="heat-name" style="font-size:${nameSize}px">${s.sector}</div>` +

    {key:'day',label:'Day',align:'right',format:'pct2',color:true}, {key:'week',label:'WoW',align:'right',format:'pct2',color:true},
    {key:'month',label:'MoM',align:'right',format:'pct2',color:true}, {key:'ytd',label:'YTD',align:'right',format:'pct2',color:true},

/* ---------------------------------------------------------------------
   BLOCKS tab
--------------------------------------------------------------------- */
initializers.blocks = function(){
  const root = document.getElementById('tab-blocks');
  const b = DATA.blocks;
  const kpiRow = el('div','kpi-row');
  [['Block trades', fint(b.totals.trades), `${b.rows.length} instruments`],
   ['Block volume', fint(b.totals.qty), 'shares'],
   ['Block value · BDT mn', fnum(b.totals.value,1), b.totals.pct_of_turnover!=null ? fpct(b.totals.pct_of_turnover,2,false)+' of market turnover' : NA],
  ].forEach(([lbl,val,sub])=>{
    const c=el('div','kpi-card'); c.appendChild(el('div','kpi-label',lbl));
    const main=el('div','kpi-main'); main.appendChild(el('div','kpi-value',val)); c.appendChild(main);
    c.appendChild(el('div','kpi-sub',sub)); kpiRow.appendChild(c);
  });
  root.appendChild(kpiRow);

  const cTbl = card(`All ${b.rows.length} block transactions`, 'DSE / Prices in Block Transactions table');
  const tot = b.totals.value || 1;
  const rows = b.rows.map(r=>({...r,
    spread: (r.max&&r.min)?((r.max/r.min-1)*100):0,
    pctOfBlock: r.value/tot*100,
    vwap: (r.value && r.qty && r.qty > 0) ? (r.value * 1e6 / r.qty) : null,
  }));
  const t = document.createElement('div'); cTbl.appendChild(t);
  buildTable(t, [{key:'code',label:'Instrument'},{key:'max',label:'Max price',align:'right',format:'num2'},
    {key:'min',label:'Min price',align:'right',format:'num2'},{key:'spread',label:'Spread',align:'right',format:'pct2ns'},
    {key:'vwap',label:'Wtd Price',align:'right',format:'num2'},
    {key:'trades',label:'Trades',align:'right',format:'int'},{key:'qty',label:'Volume',align:'right',format:'int'},
    {key:'value',label:'Value (mn)',align:'right',format:'num2'},{key:'pctOfBlock',label:'% of block',align:'right',format:'pct2ns'},
  ], rows, {defaultSort:'value'});
  root.appendChild(cTbl);

  if(b.rows.length){
    const cChart = card('Block value concentration — today', 'top 12 instruments by block value (BDT mn)');
    const cv = document.createElement('canvas'); cChart.appendChild(cv);
    root.appendChild(cChart);
    const top = b.rows.slice(0,12);
    barChart(cv, top.map(r=>r.code), top.map(r=>r.value), {color:hexA(TH.accent,.75), tooltipFmt:v=>fnum(v,2)+' mn'});
  }

  if(b.top12_15d && b.top12_15d.length){
    const span = b.top12_15d_span;
    const cH = card('Block value concentration — last 15 sessions',
      `Cumulative block value (BDT mn) with volume-weighted avg price · ${span.length===2 ? dstr(span[0])+' to '+dstr(span[1]) : ''}`);
    const cvH = document.createElement('canvas'); cH.appendChild(cvH);
    barChart(cvH, b.top12_15d.map(r=>r.code), b.top12_15d.map(r=>r.value),
      {color:hexA('#7c3aed',.75), tooltipFmt:v=>fnum(v,2)+' mn'});
    const t15d = document.createElement('div'); cH.appendChild(t15d);
    buildTable(t15d, [
      {key:'code',label:'Instrument'},
      {key:'value',label:'Cumul. Value (mn)',align:'right',format:'num2'},
      {key:'weighted_price',label:'Weighted Avg Price',align:'right',format:'num2'},
    ], b.top12_15d, {search:false, defaultSort:'value'});
    cH.appendChild(el('div','note','Weighted Avg Price = Σ(block value) ÷ Σ(block value ÷ block avg price) per session — the value-weighted average price at which block trades occurred over the period, derived from Historical Data\'s Block Value and Block Avg. Price sections.'));
    root.appendChild(cH);
  }
};

--------------------------------------------------------------------- */
initializers.macro = function(){
  const root = document.getElementById('tab-macro');
  const mc = DATA.macro;
  root.appendChild(el('div','banner '+(mc.stale?'warn':'ok'),
    `External macro inputs retrieved ${mc.retrieved||NA}${mc.stale?' — STALE, refresh macro_data.json':''}`));

  const g2 = el('div','grid2');
  const cYC = card('Govt securities yield curve', 'latest auction cut-off by tenor — External source');
  const yc = mc.yield_curve || {};
  const tenors = yc.tenors || [];
  if(tenors.length){
    const cv = document.createElement('canvas'); cv.style.maxHeight='210px'; cYC.appendChild(cv);
    lineChart(cv, tenors.map(t=>t.tenor), [
      {label:'Cut-off yield %', data:tenors.map(t=>t.yield), color:TH.accent, fill:true},
      {label:'Prior month %', data:tenors.map(t=>t.prev_month), color:TH.flat, dash:[4,3]},
    ]);
    const t = document.createElement('div'); cYC.appendChild(t);
    buildTable(t, [{key:'tenor',label:'Tenor'},{key:'yield',label:'Cut-off yield',align:'right',format:(v)=>v!=null?v.toFixed(4)+'%':NA},
      {key:'auction_date',label:'Auction',align:'right',format:'date'},
      {key:'mom',label:'MoM',align:'right',format:(v)=>v!=null?fpct(v)+'pp':'n/a', color:true}],
      tenors.map(t=>({...t, mom: (t.prev_month!=null&&t.yield!=null)? t.yield-t.prev_month : null})), {search:false});
  } else cYC.appendChild(el('div','empty-note', `${NA} — macro_data.json holds no yield-curve entries.`));
  g2.appendChild(cYC);

  const cInf = card('Point-to-point inflation', 'year-on-year CPI, monthly — External source');
  const infl = mc.inflation || {};
  const series = infl.series || [];
  if(series.length){
    const cv = document.createElement('canvas'); cv.style.maxHeight='210px'; cInf.appendChild(cv);
    lineChart(cv, series.map(s=>s.month), [{label:'General inflation %', data:series.map(s=>s.general), color:'#f59e0b', fill:true}]);
    const t = document.createElement('div'); cInf.appendChild(t);
    buildTable(t, [{key:'month',label:'Month'},{key:'general',label:'General',align:'right',format:(v)=>v!=null?v.toFixed(2)+'%':NA},
      {key:'food',label:'Food',align:'right',format:(v)=>v!=null?v.toFixed(2)+'%':'n/a'},
      {key:'non_food',label:'Non-food',align:'right',format:(v)=>v!=null?v.toFixed(2)+'%':'n/a'}], series, {search:false});
  } else cInf.appendChild(el('div','empty-note', `${NA} — macro_data.json holds no inflation series.`));
  g2.appendChild(cInf);
  root.appendChild(g2);

  const cSrc = card('External source attribution');
  const lines = [];
  if(yc.source) lines.push(`Yield curve — ${yc.source}`);
  if(yc.note) lines.push(yc.note);
  if(infl.source) lines.push(`Inflation — ${infl.source}`);
  if(infl.note) lines.push(infl.note);
  cSrc.appendChild(el('div','note', lines.length ? lines.join('<br>') : `No external macro source recorded — both panels show ${NA}.`));
  root.appendChild(cSrc);

  const cBonds = card('Listed treasury / corporate bond prices', 'DSE / Treasury Bond table — workbook data, not external');
  const tB = document.createElement('div'); cBonds.appendChild(tB);
  buildTable(tB, [{key:'code',label:'Instrument'},{key:'close',label:'Close',align:'right',format:'num2'},
    {key:'ycp',label:'YCP',align:'right',format:'num2'},
    {key:'chg',label:'Change',align:'right',format:'pct2',color:true},
    {key:'trade',label:'Trades',align:'right',format:'int'},{key:'value',label:'Value (mn)',align:'right',format:'num2'},
    {key:'vol',label:'Volume',align:'right',format:'int'}],
    mc.bonds.map(b=>({...b, chg:(b.close&&b.ycp)?((b.close/b.ycp-1)*100):null})), {defaultSort:'value', rowTintBy:'chg'});
  root.appendChild(cBonds);
};

/* ---------------------------------------------------------------------
   CALENDAR tab
--------------------------------------------------------------------- */
initializers.calendar = function(){
  const root = document.getElementById('tab-calendar');
  const cal = DATA.calendar;
  const calCols = [{key:'date',label:'Date',format:'date'},{key:'ticker',label:'Ticker'},
    {key:'cash',label:'Cash %',align:'right',format:'num1'},{key:'stock',label:'Stock %',align:'right',format:'num1'},
    {key:'yield',label:'Yield',align:'right',format:'pct2ns'}];

  const dateFrom = document.createElement('input'); dateFrom.type='date';
  const dateTo = document.createElement('input'); dateTo.type='date';
  const dateWrap = el('div'); dateWrap.appendChild(document.createTextNode('From '));
  dateWrap.appendChild(dateFrom);
  dateWrap.appendChild(document.createTextNode(' to ')); dateWrap.appendChild(dateTo);
  dateWrap.className = 'tbl-toolbar';

  const g2 = el('div','grid2');
  const cRec = card('Upcoming record dates', 'next 60 days');
  const tRec = document.createElement('div'); cRec.appendChild(tRec);
  const cAgm = card('Upcoming AGMs', 'next 60 days');
  const tAgm = document.createElement('div'); cAgm.appendChild(tAgm);

  let hRec, hAgm;
  function inRange(r){
    if(dateFrom.value && r.date < dateFrom.value) return false;
    if(dateTo.value && r.date > dateTo.value) return false;
    return true;
  }
  if(cal.records.length){ hRec = buildTable(tRec, calCols, cal.records, {search:false}); }
  else cRec.appendChild(el('div','empty-note','No record dates fall in the next 60 days.'));
  if(cal.agms.length){ hAgm = buildTable(tAgm, calCols, cal.agms, {search:false}); }
  else cAgm.appendChild(el('div','empty-note','No AGMs fall in the next 60 days.'));
  [dateFrom,dateTo].forEach(inp=>inp.addEventListener('change', ()=>{
    if(hRec) hRec.setFilter(inRange); if(hAgm) hAgm.setFilter(inRange);
  }));
  const cDateFilter = card('Date range filter'); cDateFilter.appendChild(dateWrap);
  root.appendChild(cDateFilter);
  g2.appendChild(cRec); g2.appendChild(cAgm);
  root.appendChild(g2);

  // Talk of the Market and Data provenance cards hidden for now
};
